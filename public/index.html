<!DOCTYPE html>

<body>
  <div class="app-layout">

    <!-- =========================
         SIDEBAR
    ========================== -->
    <aside id="app-sidebar" class="app-sidebar" data-lenis-prevent>

      <div class="sidebar-header">
        <div class="brand-logo">

          <div class="brand-icon-box">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"

              <path d="M22 10v6" />
              <path d="M2 10l10-5 10 5-10 5z" />
              <path d="M6 12v5c3 3 9 3 12 0v-5" />
            </svg>

          <div class="brand-text">
            <h1>Find My PKL</h1>
            <span>SMK Taruna Bangsa Bekasi</span>

        <div class="user-info">

            Ahmad Fauzi
          </div>

          <div id="sidebar-user-tag" class="user-role-tag">
            XII RPL 1
          </div>
        </div>

      </div>

      <!-- Dynamic Navigation -->
      <nav id="sidebar-nav-list" class="sidebar-nav" aria-label="Navigasi utama">
        <!-- Navigation links populated by JavaScript -->
      </nav>

      <!-- Sidebar Footer -->
      <div class="sidebar-footer">

        <div class="sidebar-footer-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="16" x2="12" y2="12" />

        <p>
          Email:
          <a href="mailto:hubin@smktarunabangsa.sch.id">
            hubin@smktarunabangsa.sch.id
          </a>
          <br />

          Telp:
          <a href="tel:+622188951234">
            (021) 8895-1234
          </a>
          <br />

          Kota Bekasi, Jawa Barat
        </p>

      </div>

    </aside>
    <div id="sidebar-backdrop" class="sidebar-backdrop" aria-hidden="true"></div>


    <!-- =========================
         MAIN APPLICATION
    ========================== -->
    <main class="app-main">

      <!-- Main Header -->
      <header id="main-header" class="main-header">

        <div class="header-left">

          <!-- Mobile Menu Button -->
          <button id="menu-toggle-btn" class="btn btn-secondary btn-sm" type="button" aria-label="Buka menu navigasi"
            aria-controls="app-sidebar" aria-expanded="false">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"

          </button>

          <!-- Page Information -->
          <div class="header-title-area">
            <h2 id="header-title">
              Jelajah Lowongan PKL
            </h2>

            <p id="header-desc">
              Temukan lowongan magang industri resmi yang sesuai dengan
              kompetensi keahlian Anda.
            </p>
          </div>

        </div>

        <!-- Dynamic Header Actions -->
        <div id="header-actions" class="header-actions">
          <!-- Populated by JavaScript -->
        </div>

      </header>


      <!-- =========================
           DYNAMIC PAGE CONTENT
      ========================== -->
      <div id="main-content-body" class="content-body">
        <!-- Page content injected by app.js -->
      </div>

    </main>

  ========================== -->

      </div>

      <div id="modal-body-content" class="modal-body" data-lenis-prevent>
        <!-- Modal content injected dynamically -->
      </div>

    </div>

  ========================== -->
